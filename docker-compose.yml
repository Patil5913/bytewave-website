# Local Postgres for Payload. `docker compose up -d` brings it back after a
# host/Docker restart (survives via the named volume + restart policy).
services:
  postgres:
    image: postgres:16-alpine
    container_name: bwave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bwave
      POSTGRES_PASSWORD: bwave
      POSTGRES_DB: bwave
    ports:
      - "5432:5432"
    volumes:
      - bwave-pgdata:/var/lib/postgresql/data

volumes:
  bwave-pgdata:
