networks:
  bytewave-network:
    external: true

services:
  bytewave:
    container_name: bytewave
    build: .
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SERVER_URL: https://bytewavewebsite.vrugle.com
      DATABASE_URI: postgresql://bytewave:bytewave123@postgres-prod:5432/bytewave

    networks:
      - bytewave-network

    expose:
      - "3000"
