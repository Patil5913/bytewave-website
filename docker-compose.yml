networks:
  bytewave-network:
    external: true

services:
  bytewave:
    container_name: bytewave
    build: .
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SERVER_URL: https://bytewavewebsite.vrugle.com
      DATABASE_URI: postgresql://bytewave:bytewave123@postgres-prod:5432/bytewave

    networks:
      - bytewave-network

    expose:
      - "3000"

  # Local Postgres for development only — the production stack points at
  # postgres-prod on the shared network instead. Behind a profile so it never
  # starts as part of a deploy:
  #
  #   docker compose --profile local up -d postgres
  #
  # `bun run db:up` then starts this container on subsequent runs.
  postgres:
    profiles: ["local"]
    image: postgres:16-alpine
    container_name: bwave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bwave
      POSTGRES_PASSWORD: bwave
      POSTGRES_DB: bwave
    ports:
      # 5433 on the host: 5432 is commonly taken by another project's Postgres.
      - "5433:5432"
    volumes:
      - bwave-pgdata:/var/lib/postgresql/data

volumes:
  bwave-pgdata:
